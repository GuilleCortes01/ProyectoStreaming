<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap"
    />
    <link rel="stylesheet" href="./estilos/style.css" />
    <link rel="stylesheet" href="./estilos/login.css" />
    <title>Iniciar sesión | RollingMovie</title>
  </head>
  <body>
    <main
      class="min-vh-100 d-flex align-items-center justify-content-center px-3 py-4"
    >
      <form class="Formulario d-flex flex-column w-100" action="index.html">
        <p class="Titulo d-flex align-items-center mb-0">Inicio de Sesión</p>
        <p class="Mensaje mb-0">Inicia sesión para acceder a tu cuenta.</p>

        <label>
          <input
            class="Campo"
            type="email"
            name="email"
            placeholder=""
            required
            maxlength="50"
            pattern="[^@\s]+@[^@\s]+\.[A-Za-z]{2,}"
            title="Ejemplo: usuario@correo.com"
          />
          <span>Email</span>
          <small class="Error"
            >Ingresá un email válido (ej: usuario@correo.com)</small
          >
        </label>

        <label>
          <input
            class="Campo"
            type="password"
            name="contrasena"
            placeholder=""
            required
            minlength="8"
            maxlength="20"
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,20}"
            title="De 8 a 20 caracteres, con al menos una mayúscula, una minúscula y un número"
          />
          <span>Contraseña</span>
          <small class="Error"
            >De 8 a 20 caracteres, con una mayúscula, una minúscula y un
            número</small
          >
        </label>

        <button type="submit" class="BotonEnviar">Iniciar sesión</button>
        <p class="IniciarSesion text-center mb-0">
          ¿No tienes una cuenta? <a href="registro.html">Registrarse</a>
        </p>
      </form>
    </main>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
