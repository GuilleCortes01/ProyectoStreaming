<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap"
    />
    <link rel="stylesheet" href="./estilos/style.css" />
    <link rel="stylesheet" href="estilos/nav.css" />
    <title>ROLLING MOVIES</title>
  </head>
  <body>
    <nav class="navbar lg:navbar-expand" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">ROLLING MOVIES</a>

        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#menuNavegacion"
          aria-controls="menuNavegacion"
          aria-expanded="false"
          aria-label="Abrir menú"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>

        <dialog
          class="drawer drawer-end"
          tabindex="-1"
          id="menuNavegacion"
          aria-labelledby="menuNavegacionTitulo"
        >
          <div class="drawer-header">
            <h2 class="drawer-title navbar-brand" id="menuNavegacionTitulo">
              ROLLING MOVIES
            </h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="drawer"
              aria-label="Cerrar menú"
            ></button>
          </div>

          <div class="drawer-body">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="peliculas.html">Películas</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="suscripcion.html">Suscribirme</a>
              </li>
            </ul>

            <form class="d-flex" role="search">
              <input
                class="form-control"
                type="search"
                placeholder="Buscar"
                aria-label="Buscar"
              />
              <button class="btn" type="submit">Buscar</button>
              <a class="btn btn-login" href="login.html">Login</a>
            </form>
          </div>
        </dialog>
      </div>
    </nav>
    <footer class="footer">
      <div class="footercontainer">
        <div class="footerleft">
          <h3>Rolling Movies</h3>
          <p>Tu catálogo de películas favorito.</p>
        </div>

        <div class="footerlinks">
          <a href="#sobrenosotros">Sobre nosotros</a>
          <a href="#preguntasfrecuentes">Preguntas frecuentes y ayuda</a>
          <a href="#contacto">Contactanos</a>
        </div>
      </div>

      <p class="footercopy">
        © <span id="year"></span> RollingMovie. Todos los derechos reservados.
      </p>
    </footer>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
